<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ead1bd">
  <title>绒绒星球 v4.2 · 糯团人格</title><link rel="icon" href="./favicon.svg?v=4.2" type="image/svg+xml"><link rel="stylesheet" href="./css/style.css?v=4.2"><link rel="stylesheet" href="./css/animations.css?v=4.2">
</head>
<body><div class="game-shell" id="gameShell">
  <main class="home-screen active" id="homeScreen">
    <section class="room" id="room" aria-label="绒绒们的暖光房间">
      <div class="room-bg" aria-hidden="true"><span class="window"></span><span class="sunbeam"></span><span class="shelf"></span><span class="bed"></span><span class="rug"></span></div>
      <header class="topbar">
        <button class="player-card glass" data-panel="profile"><span class="avatar">☁</span><span><b>Lv. <i id="level">12</i></b><em><u id="xpBar"></u></em></span></button>
        <button class="coin-card glass" data-panel="shop"><span>◉</span><b id="coins">1280</b><i>＋</i></button>
        <nav class="quick-actions" aria-label="快捷功能"><button data-action="camera" aria-label="相机">📷</button><button data-panel="mail" aria-label="邮件">✉<i class="badge">1</i></button><button data-panel="settings" aria-label="设置">⚙</button></nav>
      </header>
      <nav class="side-nav" aria-label="房间功能"><button class="active" data-panel="home"><span>⌂</span>家园</button><button data-panel="pets"><span>🐾</span>萌宠</button><button data-panel="bag"><span>👜</span>背包</button><button data-panel="shop"><span>▣</span>商店</button></nav>
      <div class="pet-lineup" id="petLineup" aria-label="五位绒绒伙伴"></div><div class="speech-bubble" id="speech" role="status" aria-live="polite"></div>
    </section>
    <section class="life-strip" id="lifeStrip" aria-label="伙伴生活场景"></section>
  </main>
  <section class="page" id="tasksScreen"><header><button data-back>‹</button><div><small>每天一点点</small><h1>今日任务</h1></div></header><div class="content-grid" id="taskList"></div></section>
  <section class="page" id="exploreScreen"><header><button data-back>‹</button><div><small>一起去看看</small><h1>星球探索</h1></div></header><div class="explore-hero"><span>🌿</span><h2>叶光小径</h2><p>五位伙伴会带回不同的发现。</p><button class="primary" id="exploreBtn">出发探索</button></div></section>
  <section class="page" id="archiveScreen"><header><button data-back>‹</button><div><small>慢慢了解彼此</small><h1>伙伴图鉴</h1></div></header><div class="archive-grid" id="archiveGrid"></div></section>
  <nav class="bottom-nav" aria-label="主导航"><button class="active" data-screen="homeScreen"><span>⌂</span>家园</button><button data-screen="tasksScreen"><span>✓</span>任务</button><button data-screen="exploreScreen"><span>◇</span>探索</button><button data-screen="archiveScreen"><span>▧</span>图鉴</button></nav>
</div>
<div class="modal" id="panelModal" aria-hidden="true"><div class="sheet"><button class="close" data-close>×</button><div id="panelContent"></div></div></div><div class="toast" id="toast" role="status"></div>
<script src="./vendor/pixi.min.js?v=8.20.1" defer></script><script src="./js/pets.js?v=4.2" defer></script><script src="./js/dialogue.js?v=4.2" defer></script><script src="./js/migration.js?v=4.2" defer></script><script src="./js/state.js?v=4.2" defer></script><script src="./js/relationships.js?v=4.2" defer></script><script src="./js/reactions.js?v=4.2" defer></script><script src="./js/behaviors.js?v=4.2" defer></script><script src="./js/animations.js?v=4.2" defer></script><script src="./js/pixi/pets/nuotuan/config.js?v=4.2" defer></script><script src="./js/pixi/pets/nuotuan/state.js?v=4.2" defer></script><script src="./js/pixi/pets/nuotuan/personality.js?v=4.2" defer></script><script src="./js/pixi/scene.js?v=4.2" defer></script><script src="./js/pixi/spriteManager.js?v=4.2" defer></script><script src="./js/pixi/animation.js?v=4.2" defer></script><script src="./js/pixi/app.js?v=4.2" defer></script><script src="./js/app.js?v=4.2" defer></script>
</body></html>
